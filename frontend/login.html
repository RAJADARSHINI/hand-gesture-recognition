<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hand Gesture Recognition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-hand-spock"></i>
                </div>
                <h1>GestureAI</h1>
                <p>Hand Gesture Recognition System</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="divider">OR</div>

                <button type="button" class="social-btn google-btn">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
                <button type="button" class="social-btn github-btn">
                    <i class="fab fa-github"></i> Sign in with GitHub
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Sign up here</a></p>
            </div>
        </div>

        <div class="login-image">
            <div class="floating-icon">
                <i class="fas fa-hands"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Unlock the power of gesture recognition with AI-powered hand gesture detection</p>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
